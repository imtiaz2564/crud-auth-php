# Included inside the existing localhost server block.
location = /www/blog-project {
    return 301 /www/blog-project/;
}

location = /www/blog-project/index.php {
    include F:/MNP/nginx/conf/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME F:/MNP/nginx/html/www/blog-project/public/index.php;
    fastcgi_param DOCUMENT_ROOT F:/MNP/nginx/html/www/blog-project/public;
    fastcgi_pass 127.0.0.1:9023;
    fastcgi_read_timeout 3600;
}

location ^~ /www/blog-project/ {
    alias F:/MNP/nginx/html/www/blog-project/public/;
    index index.php;
    autoindex off;

    # Only the exact front-controller location above may execute PHP.
    location ~* \.(php|phtml|phar)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
}

